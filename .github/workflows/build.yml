name: Build APK                 # название сборки, его ты увидишь во вкладке Actions

on:
  workflow_dispatch:            # запуск вручную кнопкой "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest      # облачный компьютер с Linux

    steps:
      - name: Скачать код
        uses: actions/checkout@v4
        with:
          submodules: recursive # скачать и вложенные репозитории тоже

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Подставить свои ключи
        run: |
          # sed ищет текст в файле и заменяет его на другой
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = ${{ secrets.TG_API_ID }};/" $F
          sed -i "s/APP_HASH = \"[0-9a-f]*\";/APP_HASH = \"${{ secrets.TG_API_HASH }}\";/" $F

      - name: Подставить свой адрес в google-services
        run: |
          # достаём твой адрес из gradle.properties (всё, что после "APP_PACKAGE=")
          PKG=$(grep '^APP_PACKAGE=' gradle.properties | cut -d= -f2)
          echo "Мой адрес: $PKG"
          # находим файл google-services.json и меняем в нём адрес на твой (+ хвостик .beta)
          find . -name google-services.json -exec sed -i -E "s|\"package_name\": *\"[^\"]*\"|\"package_name\": \"$PKG.beta\"|" {} +

      - name: Собрать приложение
        run: |
          chmod +x gradlew      # разрешаем запуск файла gradlew
          ./gradlew assembleDebug

      - name: Сохранить apk
        uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: "**/*.apk"
